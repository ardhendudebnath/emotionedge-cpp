# The Phase-1 "baseline pipe" with real engines: Silero VAD -> whisper.cpp -> NLLB-200
# (CTranslate2) -> Piper, plus the prosody/lexicon emotion path. Needs a build with
#   -DEE_WITH_ONNXRUNTIME=ON -DEE_WITH_WHISPER=ON -DEE_WITH_CTRANSLATE2=ON -DEE_WITH_PIPER=ON
# and the models from models/manifest.json (see models/README.md).
#
# Only the parameters that differ from pipeline.yaml's stand-ins are listed; the graph is the same.

pipeline:
  name: emotionedge-engines
  source_language: en
  target_language: hi
  sample_rate: 16000
  models: ${config_dir}/../models/manifest.json
  # Phase 4: stages without their own `device` run on CUDA when the build has it (ONNX Runtime's
  # GPU package, CTranslate2 built with CUDA) and a GPU is present, else on the CPU. Force one
  # with --set pipeline.device=cpu (or cuda, which warns when it has to fall back).
  device: auto

telemetry:
  flush_ms: 1000

# Worker threads an engine starts from its stage's thread inherit that thread's cores (whisper.cpp
# starts its workers on every decode), so each set must cover the stage's `threads`. The config
# is rejected otherwise. Cores that do not exist on the machine are skipped; adjust to your CPU.
threads:
  - { name: T1-dsp-vad,    cores: [1],              priority: high }
  - { name: T2-asr,        cores: [2, 3, 4, 5],     priority: high }   # blueprint: 4 ASR worker cores
  - { name: T3-emotion,    cores: [6, 14, 15, 16],  priority: high }   # emotion2vec+ x2, DistilRoBERTa
  - { name: T4-understand, cores: [7, 8, 9, 10],    priority: high }
  - { name: T5-tts,        cores: [11, 12, 17, 18, 19, 20], priority: high }   # Kokoro's vocoder
  - { name: T6-playback,   cores: [13],             priority: realtime }

stages:
  - name: frontend
    type: frontend
    thread: T1-dsp-vad
    tick_ms: 20
    params:
      frame_ms: 20
      agc: { enabled: true, target_dbfs: -23 }
      # Echo cancellation (1.2) slot. None is built in yet: SpeexDSP and WebRTC AEC3 were
      # measured on a simulated loudspeaker loop, and both left the speaker's voice worse while
      # the translation played (README, "Echo cancellation"). Use headphones. The reference a
      # canceller needs (what the device plays, aligned with the microphone) is in place;
      # `record` captures both for tuning one.
      echo_canceller: none
      aec: { reference_slack_ms: 40 }

  - name: segmenter
    type: segmenter
    thread: T1-dsp-vad
    params:
      detector: silero
      model_id: vad.silero.v6
      device: cpu
      threads: 1              # a 32 ms window is too small to split across workers
      hangover_ms: 160
      preroll_ms: 200
      # One speaker being interpreted: the speaker's next phrase must not cancel the translation
      # of the last one (barge-in is for a listener talking over the playback).
      barge_in: false

  - name: speaker
    type: speaker
    thread: T3-emotion
    params:
      # Phase 3: the 192-d ECAPA-TDNN voice print (1.4). Kokoro cannot clone a voice, so the TTS
      # picks its nearest voice by the speaker's median F0, which travels with every print.
      encoder: ecapa
      model_id: speaker.ecapa.voxceleb
      threads: 2
      # Phase 4: speaker-aware barge-in. Speech that starts while the translation plays is
      # embedded after barge_in_ms. Only a voice unlike the interpreted speaker's cancels the
      # translation; the speaker talking on and the translation's own echo do not. It arms once
      # 3 of the speaker's utterances are enrolled. On RAVDESS (24 actors, one studio microphone;
      # ml/eval/eval_speaker_verification.py), with a 1.5 s probe and a warm reference:
      # - the speaker is wrongly cut off 1.8% of the time;
      # - another voice is missed 12.6% of the time (25% for the same gender).
      # Kokoro's echo scores >= 0.59 against its own voice; people stay <= 0.32 against it.
      barge_in: true
      barge_in_ms: 1500
      barge_in_threshold: 0.25
      barge_in_enrol: 3
      echo_threshold: 0.45

  - name: asr
    type: asr
    thread: T2-asr
    params:
      # On the GPU in a build with EE_WHISPER_CUDA (pipeline.device: auto): the final decode takes
      # ~35 ms instead of ~230 ms on these 4 cores, with the same transcripts.
      engine: whisper
      model_id: asr.whisper.base.q5_1
      language: auto          # automatic language ID
      threads: 4              # blueprint: 4 worker cores
      beam: 1
      audio_ctx: auto         # encoder window sized to the utterance, >= 10 s (0 = full 30 s)
      partial_interval_ms: 500
      min_partial_ms: 1000

  - name: emotion
    type: emotion
    thread: T3-emotion
    params:
      # Phase 2 "emotion in": emotion2vec+ on the voice, DistilRoBERTa on the words. Both are
      # classifiers mapped to V·A·D by their labels.json. The prosody rules and the lexicon are
      # the stand-ins (acoustic: prosody, lexical: lexicon).
      acoustic: onnx
      acoustic_model_id: emotion.acoustic.emotion2vec_plus_base
      acoustic_max_seconds: 6     # the utterance's last 6 s; cost grows with length
      lexical: onnx
      lexical_model_id: emotion.lexical.distilroberta_en
      lexical_device: cpu         # its INT8 graph: 4 ms per sentence on the CPU, 10 ms on CUDA
      threads: 4
      # emotion2vec+ also reads valence from the voice, unlike the prosody rules (0.3). Text is
      # still the stronger valence cue, but less so on arousal and dominance.
      fusion:
        acoustic: { valence: 0.7, arousal: 1.0, dominance: 0.8 }
        lexical: { valence: 0.8, arousal: 0.5, dominance: 0.4 }

  - name: state
    type: state
    thread: T4-understand
    tick_ms: 10

  - name: translate
    type: translate
    thread: T4-understand
    params:
      engine: ct2
      # Phase 2: NLLB-600M + a LoRA trained on the runtime's `<emo=... a=... reg=...>` prefix
      # (ml/train/finetune_nllb_lora.py). Plain NLLB: model_id mt.nllb200.distilled600m.int8
      # with control_tokens: auto, which gives it plain text.
      model_id: mt.nllb200.distilled600m.emo.int8
      control_tokens: on
      arousal_step: 0.1       # the prefix format the LoRA was trained on
      compute_type: int8      # on the CPU
      gpu_compute_type: int8_float16   # on CUDA: what the phase-2 quality gate measured
      beam: 2
      threads: 4
      expressivity: ${config_dir}/expressivity.yaml

  - name: controller
    type: controller
    thread: T4-understand
    params:
      expressivity: ${config_dir}/expressivity.yaml
      # Phase 4: the learned prosody plan for the Kokoro voice (ml/train/learn_controller.py,
      # prosody_controller.json in its directory) replaces the rules' rate, pitch, range and
      # contour for some emotions. It adopted joy, sadness and surprise: on held-out sentences
      # both the consistency judge and an independent one heard them better, at the runtime's
      # strengths. End to end on RAVDESS (ml/README.md), only sadness gained beyond run-to-run
      # noise: ECS rose, valence and dominance moved toward it, arousal did not. Joy and surprise
      # keep the rules. learned_plan: false = the rules throughout.
      plan_model_id: tts.kokoro.82m.hi
      plan_emotions: [sadness]

  - name: tts
    type: tts
    thread: T5-tts
    tick_ms: 5
    params:
      # Phase 3: Kokoro-82M (StyleTTS2 family) with the emotion controller driving its duration,
      # F0 and final contour, plus learned per-emotion style offsets. On CUDA a clause takes
      # ~70-95 ms whatever its length. On the CPU its vocoder costs ~300 ms, hence the 3-word cap
      # on the first clause and 6 cores (on the GPU the cap measured no different).
      # Piper fallback: engine: piper, model_id: tts.piper.hi_IN.pratham.medium, threads: 2.
      engine: kokoro
      model_id: tts.kokoro.82m.hi
      # Nearest of hf_alpha, hf_beta, hm_omega, hm_psi to the speaker's median F0. This fails for
      # high-pitched men and low-pitched women (JFK's speech, at 253 Hz, gets a female voice);
      # set voice to a fixed name for a known speaker.
      voice: auto
      voice_match: pitch
      # Learned with the intelligibility term. An independent judge agrees on direction for
      # anger, joy and sadness (arousal/dominance; valence barely moves). The fear offset only
      # fools the training judge, and surprise makes Whisper hallucinate: both stay off.
      style_offsets: style_offsets.json
      style_emotions: [anger, joy, sadness]
      max_first_words: 3
      threads: 6              # ORT spinning measured no faster here, at +50% CPU: left off
      chunk_ms: 100
      # Phase 4: adaptive pacing. The Hindi runs 0.9-2.4x as long as the English, so translations
      # queue up when the speaker talks on. An utterance is spoken faster when:
      # - it would wait behind earlier audio (0.25 s -> 1.5 s of backlog), or
      # - it would still be playing when the next one is due (fit_next: its source plus the
      #   speaker's usual gap).
      # Capped at 1.3x: Whisper's median CER on Kokoro's Hindi stays 0.15-0.16 up to 1.3x and
      # rises to 0.26 at 1.4x (ml/eval/eval_tts_speed.py).
      pacing:
        max_speed: 1.3
        fit_next: true
        start_ms: 250
        full_ms: 1500

  - name: playback
    type: playback
    thread: T6-playback
    tick_ms: 5
    params: { jitter_ms: 60, crossfade_ms: 5 }

  - name: consistency
    type: consistency
    thread: T3-emotion
    params:
      # Judges the synthesized speech with the same voice model as 2.2. The English lexical
      # model abstains on the Hindi output, so no lexical model here.
      acoustic: onnx
      acoustic_model_id: emotion.acoustic.emotion2vec_plus_base
      lexical: none
      threads: 4
      threshold: 0.75

  - name: recorder
    type: recorder
    thread: T6-playback

edges:
  - { from: frontend,    to: segmenter, capacity: 256 }
  - { from: segmenter,   to: [asr, emotion, speaker], kinds: [audio], capacity: 512 }
  - { from: segmenter,   to: [tts, playback], kinds: [control] }
  - { from: speaker,     to: tts, kinds: [voiceprint, control] }
  - { from: speaker,     to: playback, kinds: [control] }        # speaker-aware barge-in
  - { from: tts,         to: speaker, kinds: [synthaudio], capacity: 256, feedback: true }  # its own voice
  - { from: asr,         to: [emotion, state, translate, recorder], kinds: [transcript] }
  - { from: emotion,     to: state, kinds: [emotion] }
  - { from: state,       to: [translate, recorder], kinds: [utterance] }
  - { from: translate,   to: [controller, recorder], kinds: [translation] }
  - { from: controller,  to: [tts, recorder], kinds: [speech] }
  - { from: tts,         to: [playback, consistency], kinds: [synthaudio], capacity: 256 }
  - { from: consistency, to: controller, kinds: [feedback], feedback: true }
  - { from: consistency, to: recorder, kinds: [feedback] }
  - { from: playback,    to: recorder, kinds: [playout] }
